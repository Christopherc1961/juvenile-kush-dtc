name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NITRO_PRESET: github_pages
          VITE_BASE: /juvenile-kush-dtc/
      - name: Locate static output
        run: |
          if [ -d .output/public ]; then echo "OUT=.output/public" >> "$GITHUB_ENV"
          elif [ -d dist ]; then echo "OUT=dist" >> "$GITHUB_ENV"
          elif [ -d .vercel/output/static ]; then echo "OUT=.vercel/output/static" >> "$GITHUB_ENV"
          else echo "No static output" && ls -la && exit 1
          fi
          ls -la "$OUT" | head
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
